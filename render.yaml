services:
  - type: web
    name: dispomix-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: BACKEND_URL
        value: https://dispomix-bot.onrender.com
